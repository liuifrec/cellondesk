name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - id: version
        run: python -c "import runpy; print('value='+runpy.run_path('src/cellondesk/_version.py')['__version__'])" >> "$GITHUB_OUTPUT"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m pip install --force-reinstall dist/*.whl
      - run: cellondesk doctor --json package-diagnostics.json
      - run: python -c "import cellondesk; from importlib.metadata import version; assert cellondesk.__version__ == version('cellondesk') == '${{ steps.version.outputs.value }}'"
      - run: python -I scripts/check_h5ad_package.py
      - uses: actions/upload-artifact@v4
        with:
          name: cellondesk-${{ steps.version.outputs.value }}-packages
          path: |
            dist/*
            package-diagnostics.json

  h5ad-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,browser]"
      - run: python -m playwright install --with-deps chromium
      - run: pytest tests/test_h5ad_browser.py tests/test_modality_browser.py -v
        env:
          CELLONDESK_BROWSER_TESTS: "1"
          CELLONDESK_BROWSER_ARTIFACTS: build/h5ad-dashboard
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h5ad-dashboard-screenshots
          path: build/h5ad-dashboard

  discovery-gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0
      - run: pip install -e ".[dev,gui]"
      - run: pytest tests/test_discovery.py tests/test_modality_discovery.py tests/test_discovery_gui.py tests/test_desktop_tasks.py -v
        env:
          QT_QPA_PLATFORM: offscreen
          CELLONDESK_GUI_ARTIFACTS: build/discovery
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: discovery-workspace-screenshots
          path: build/discovery
