name: Live HuBMAP smoke

on:
  pull_request:
  workflow_dispatch:

jobs:
  hubmap-search-to-html:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - run: python scripts/live_hubmap_smoke.py
