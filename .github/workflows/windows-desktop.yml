name: Windows desktop package

on:
  pull_request:
    paths:
      - "src/cellondesk/**"
      - "packaging/windows/**"
      - "pyproject.toml"
      - ".github/workflows/windows-desktop.yml"
  workflow_dispatch:

jobs:
  build-windows-desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packaging dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[packaging]"
      - name: Run source tests
        run: pytest
      - name: Build portable desktop application
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir `
            --name CellOnDesk `
            --collect-all PySide6 `
            --hidden-import h5py `
            --hidden-import numpy `
            src/cellondesk/desktop.py
      - name: Smoke-test packaged executable
        shell: pwsh
        run: |
          dist\CellOnDesk\CellOnDesk.exe --diagnostics packaged-diagnostics.json
          if (!(Test-Path packaged-diagnostics.json)) { throw "Packaged diagnostics were not written" }
          $report = Get-Content packaged-diagnostics.json | ConvertFrom-Json
          if (!$report.python) { throw "Packaged diagnostics are incomplete" }
      - name: Create portable ZIP
        shell: pwsh
        run: Compress-Archive -Path dist\CellOnDesk\* -DestinationPath CellOnDesk-0.9.0-Windows-x64-portable.zip
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force installer | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=0.9.0 packaging\windows\CellOnDesk.iss
      - name: Smoke-test installer
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP "CellOnDeskInstalled"
          installer\CellOnDesk-Setup-x64.exe /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR="$installDir"
          & "$installDir\CellOnDesk.exe" --diagnostics installed-diagnostics.json
          if (!(Test-Path installed-diagnostics.json)) { throw "Installed diagnostics were not written" }
          & "$installDir\unins000.exe" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
      - uses: actions/upload-artifact@v4
        with:
          name: CellOnDesk-0.9.0-Windows-x64
          path: |
            CellOnDesk-0.9.0-Windows-x64-portable.zip
            installer/CellOnDesk-Setup-x64.exe
            packaged-diagnostics.json
            installed-diagnostics.json
