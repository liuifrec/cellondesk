name: Windows desktop package
on:
  pull_request:
    paths:
      - "src/cellondesk/**"
      - "tests/**"
      - "scripts/check_desktop_diagnostics.py"
      - "packaging/windows/**"
      - "pyproject.toml"
      - ".github/workflows/windows-desktop.yml"
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: windows-desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-desktop:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Read version and record build provenance
        id: version
        shell: pwsh
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $version = python -c "import runpy; print(runpy.run_path('src/cellondesk/_version.py')['__version__'])"
          "value=$version" >> $env:GITHUB_OUTPUT
          @{ version=$version; checkout_sha=$env:GITHUB_SHA; head_sha=$env:PR_HEAD_SHA; run_id=$env:GITHUB_RUN_ID; run_number=$env:GITHUB_RUN_NUMBER } | ConvertTo-Json | Set-Content build-info.json
      - name: Install packaging dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,packaging]"
      - name: Run source and offscreen GUI tests
        env:
          QT_QPA_PLATFORM: offscreen
          CELLONDESK_GUI_ARTIFACTS: build/discovery
        run: pytest
      - name: Build portable desktop application
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir `
            --name CellOnDesk `
            --hidden-import h5py `
            --hidden-import numpy `
            --collect-data cellondesk `
            --copy-metadata cellondesk `
            packaging/windows/launcher.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed" }
          Copy-Item build-info.json dist\CellOnDesk\build-info.json
      - name: Smoke-test packaged executable and GUI
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $diagnostics = Join-Path $PWD "packaged-diagnostics.json"
          $process = Start-Process -FilePath "$PWD\dist\CellOnDesk\CellOnDesk.exe" -ArgumentList "--diagnostics", $diagnostics -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Packaged diagnostics failed" }
          if (!(Test-Path $diagnostics)) { throw "Packaged diagnostics missing" }
          python scripts/check_desktop_diagnostics.py $diagnostics --version ${{ steps.version.outputs.value }}
          if ($LASTEXITCODE -ne 0) { throw "Packaged dependency diagnostics failed" }
          $process = Start-Process -FilePath "$PWD\dist\CellOnDesk\CellOnDesk.exe" -ArgumentList "--smoke-test-gui" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Packaged GUI smoke failed" }
      - name: Create portable ZIP
        shell: pwsh
        run: Compress-Archive -Path dist\CellOnDesk\* -DestinationPath CellOnDesk-${{ steps.version.outputs.value }}-Windows-x64-portable.zip
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force installer | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ steps.version.outputs.value }} packaging\windows\CellOnDesk.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
      - name: Smoke-test installed application and uninstall
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP "CellOnDeskInstalled"
          $diagnostics = Join-Path $PWD "installed-diagnostics.json"
          $installer = Start-Process -FilePath "$PWD\installer\CellOnDesk-${{ steps.version.outputs.value }}-Setup-x64.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$installDir" -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "Installer failed" }
          $application = Start-Process -FilePath "$installDir\CellOnDesk.exe" -ArgumentList "--diagnostics", $diagnostics -Wait -PassThru
          if ($application.ExitCode -ne 0 -or !(Test-Path $diagnostics)) { throw "Installed diagnostics failed" }
          python scripts/check_desktop_diagnostics.py $diagnostics --version ${{ steps.version.outputs.value }}
          if ($LASTEXITCODE -ne 0) { throw "Installed dependency diagnostics failed" }
          $application = Start-Process -FilePath "$installDir\CellOnDesk.exe" -ArgumentList "--smoke-test-gui" -Wait -PassThru
          if ($application.ExitCode -ne 0) { throw "Installed GUI smoke failed" }
          $uninstall = Start-Process -FilePath "$installDir\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0 -or (Test-Path "$installDir\CellOnDesk.exe")) { throw "Uninstall verification failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: CellOnDesk-${{ steps.version.outputs.value }}-Windows-x64-build-${{ github.run_number }}
          if-no-files-found: error
          path: |
            CellOnDesk-${{ steps.version.outputs.value }}-Windows-x64-portable.zip
            installer/CellOnDesk-${{ steps.version.outputs.value }}-Setup-x64.exe
            build-info.json
            packaged-diagnostics.json
            installed-diagnostics.json
            build/discovery/*.png
