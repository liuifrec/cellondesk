name: Windows desktop package

on:
  pull_request:
    paths:
      - "src/cellondesk/**"
      - "packaging/windows/**"
      - "pyproject.toml"
      - ".github/workflows/windows-desktop.yml"
  workflow_dispatch:

jobs:
  build-windows-desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packaging dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,packaging]"
      - name: Run source tests
        run: pytest
      - name: Build portable desktop application
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir `
            --name CellOnDesk `
            --collect-all PySide6 `
            --hidden-import h5py `
            --hidden-import numpy `
            packaging/windows/launcher.py
      - name: Smoke-test packaged executable
        shell: pwsh
        run: |
          $diagnostics = Join-Path $PWD "packaged-diagnostics.json"
          $process = Start-Process `
            -FilePath "$PWD\dist\CellOnDesk\CellOnDesk.exe" `
            -ArgumentList "--diagnostics", $diagnostics `
            -Wait `
            -PassThru
          if ($process.ExitCode -ne 0) { throw "Packaged executable exited with $($process.ExitCode)" }
          if (!(Test-Path $diagnostics)) { throw "Packaged diagnostics were not written" }
          $report = Get-Content $diagnostics | ConvertFrom-Json
          if (!$report.python) { throw "Packaged diagnostics are incomplete" }
      - name: Create portable ZIP
        shell: pwsh
        run: Compress-Archive -Path dist\CellOnDesk\* -DestinationPath CellOnDesk-0.11.1-Windows-x64-portable.zip
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force installer | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=0.11.1 packaging\windows\CellOnDesk.iss
      - name: Smoke-test installer
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP "CellOnDeskInstalled"
          $diagnostics = Join-Path $PWD "installed-diagnostics.json"
          $installer = Start-Process `
            -FilePath "$PWD\installer\CellOnDesk-Setup-x64.exe" `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$installDir" `
            -Wait `
            -PassThru
          if ($installer.ExitCode -ne 0) { throw "Installer exited with $($installer.ExitCode)" }
          $application = Start-Process `
            -FilePath "$installDir\CellOnDesk.exe" `
            -ArgumentList "--diagnostics", $diagnostics `
            -Wait `
            -PassThru
          if ($application.ExitCode -ne 0) { throw "Installed application exited with $($application.ExitCode)" }
          if (!(Test-Path $diagnostics)) { throw "Installed diagnostics were not written" }
          Start-Process `
            -FilePath "$installDir\unins000.exe" `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" `
            -Wait
      - uses: actions/upload-artifact@v4
        with:
          name: CellOnDesk-0.11.1-Windows-x64
          path: |
            CellOnDesk-0.11.1-Windows-x64-portable.zip
            installer/CellOnDesk-Setup-x64.exe
            packaged-diagnostics.json
            installed-diagnostics.json
